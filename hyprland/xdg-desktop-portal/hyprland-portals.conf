# Hyprland's own portal needs a newer pipewire than 24.04 has (see
# hyprland/install.sh), and GNOME's needs gnome-shell. So the GTK portal does
# file pickers and the rest, and wlroots' portal, which works on Hyprland,
# does screen sharing (Teams, Firefox) and screenshots.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
