# Only what differs from lazygit's defaults; `lazygit --config` prints them all.
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
gui:
  timeFormat: 02 Jan 2006
  theme:
    activeBorderColor: ['#d8dee9', bold]
    inactiveBorderColor: ['#495c6e']
    searchingActiveBorderColor: ['#d8dea9', bold]
    selectedLineBgColor: ['#495c6e']
    inactiveViewSelectedLineBgColor: [bold]
    cherryPickedCommitFgColor: ['#ebcb8b']
    cherryPickedCommitBgColor: ['#81a1c1']
    unstagedChangesColor: ['#d08770']
    defaultFgColor: ['#d8dee9']
    authorColors:
      'Semyon Galichenko': '#8fbcbb'
      '*': '#ebcb8b'
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: false
  nerdFontsVersion: "3"
  showFileIcons: false
  border: single
  animateExplosion: false
  spinner:
    frames: ['⠋', '⠙', '⠹', '⠸', '⢰', '⣰', '⣠', '⣄', '⣆', '⡆', '⠇', '⠏']
    rate: 50
git:
  diffRenderers:
    - colorArg: always
      command: "/home/linuxbrew/.linuxbrew/bin/hunk pager"
keybinding:
  universal:
    confirmInEditor: <a-enter>
    redo: <c-z>
  commits:
    # Without the default <alt-down>/<alt-up> aliases
    moveDownCommit: <c-j>
    moveUpCommit: <c-k>
