[zsh.files]
"zsh/.zshrc" = "~/.zshrc"
"zsh/.zprofile" = "~/.zprofile"
"zsh/starship.toml" = "~/.config/starship.toml"

[tmux.files]
"tmux/.tmux.conf" = "~/.tmux.conf"
# Load-bearing: every LocalCommand in ~/.ssh/config invokes this, and
# ~/.ssh/bin/ssh-styled reads the colours back out of those entries.
"tmux/ssh_style" = "~/.tmux/ssh_style"
"tmux/popup-resize" = "~/.tmux/popup-resize"
"tmux/quick-select-window" = "~/.tmux/quick-select-window"

[nvim.files]
# A whole-directory symlink is safe here: lazy.nvim keeps plugins and state
# under stdpath("data") (~/.local/share/nvim/lazy), not in ~/.config/nvim.
"nvim" = "~/.config/nvim"

[rofi.files]
"rofi" = "~/.config/rofi"

[firefox]
# No files here: the profile directory is random per machine, so the mapping
# lives in .dotter/local.toml. Firefox here is the Ubuntu snap; the files go in
# the profile's chrome/ and need
# toolkit.legacyUserProfileCustomizations.stylesheets=true in about:config:
#
#   [files]
#   "firefox/userChrome.css" = "~/snap/firefox/common/.mozilla/firefox/<profile>/chrome/userChrome.css"
#   "firefox/userContent.css" = "~/snap/firefox/common/.mozilla/firefox/<profile>/chrome/userContent.css"

[wezterm.files]
"wezterm/.wezterm.lua" = "~/.wezterm.lua"
# Kept for now; nothing launches wezterm any more (Ghostty replaced it)
"wezterm/.wezterm.minimal.lua" = "~/.wezterm.minimal.lua"

[bin.files]
# Individual files, not the directory: ~/bin also holds tools that aren't
# tracked here. GNOME's custom shortcuts call these by their ~/bin paths
# (Alt+p gopass-menu, Super+m ddcswitch).
"bin/gopass-menu" = "~/bin/gopass-menu"
"bin/clip" = "~/bin/clip"
"bin/ghostty-popup" = "~/bin/ghostty-popup"
"bin/ddcswitch" = "~/bin/ddcswitch"

[ssh.files]
# Individual files, not the directory: ~/.ssh/bin also holds .old/.save
# copies that aren't tracked here, and a dir symlink would hide them.
"ssh/bin/sshmgmt" = "~/.ssh/bin/sshmgmt"
"ssh/bin/ssh-styled" = "~/.ssh/bin/ssh-styled"
"ssh/bin/sshpick" = "~/.ssh/bin/sshpick"

[lazygit.files]
# type = "symbolic" is required: this file is full of lazygit's own
# {{filename}} / {{selectedRef}} placeholders, which dotter would otherwise
# try to render as handlebars templates and blank out.
"lazygit/config.yml" = { target = "~/.config/lazygit/config.yml", type = "symbolic" }

[yazi.files]
# Individual files, not the directory: `ya pkg` installs plugins into
# ~/.config/yazi/plugins, which stays out of the repo like lazy.nvim's
# plugin dir. package.toml pins them; `ya pkg install` restores them.
"yazi/yazi.toml" = "~/.config/yazi/yazi.toml"
"yazi/keymap.toml" = "~/.config/yazi/keymap.toml"
"yazi/theme.toml" = "~/.config/yazi/theme.toml"
"yazi/init.lua" = "~/.config/yazi/init.lua"
"yazi/Nord.tmTheme" = "~/.config/yazi/Nord.tmTheme"
"yazi/package.toml" = "~/.config/yazi/package.toml"
# Local plugin, not from `ya pkg`
"yazi/plugins/other-pane.yazi/main.lua" = "~/.config/yazi/plugins/other-pane.yazi/main.lua"

[ghostty.files]
"ghostty/config.ghostty" = "~/.config/ghostty/config.ghostty"
"ghostty/popup.ghostty" = "~/.config/ghostty/popup.ghostty"

[gnome]
# No files: gnome/settings.sh applies gsettings, run by .dotter/post_deploy.sh

[wayland.files]
# What the Hyprland and niri sessions share: bar, launcher, notifications,
# lock and idle, input method, and the scripts in wayland/scripts/, which ask
# wayland/scripts/wm to talk to whichever compositor is running. Pulled in by either
# package below rather than enabled by hand.
"wayland/scripts/wm" = "~/.config/wayland/wm"
"wayland/scripts/launcher.sh" = "~/.config/wayland/launcher.sh"
"wayland/scripts/sysmenu.sh" = "~/.config/wayland/sysmenu.sh"
"wayland/scripts/network.sh" = "~/.config/wayland/network.sh"
"wayland/scripts/calendar.sh" = "~/.config/wayland/calendar.sh"
"wayland/scripts/notifications.sh" = "~/.config/wayland/notifications.sh"
"wayland/scripts/notify-watch.sh" = "~/.config/wayland/notify-watch.sh"
"wayland/scripts/notify-focus.sh" = "~/.config/wayland/notify-focus.sh"
"wayland/scripts/notify-click.sh" = "~/.config/wayland/notify-click.sh"
"wayland/scripts/volume.sh" = "~/.config/wayland/volume.sh"
"wayland/scripts/brightness.sh" = "~/.config/wayland/brightness.sh"
"wayland/scripts/ime.sh" = "~/.config/wayland/ime.sh"
"wayland/scripts/hotplug.sh" = "~/.config/wayland/hotplug.sh"
"wayland/scripts/menu" = "~/.config/wayland/menu"
"wayland/scripts/clipboard.sh" = "~/.config/wayland/clipboard.sh"
"wayland/scripts/cliphist-store.sh" = "~/.config/wayland/cliphist-store.sh"
# hypridle, hyprlock and hyprpolkitagent work on niri too and read ~/.config/hypr
"wayland/hypr/hypridle.conf" = "~/.config/hypr/hypridle.conf"
"wayland/hypr/hyprlock.conf" = "~/.config/hypr/hyprlock.conf"
"wayland/hypr/hyprtoolkit.conf" = "~/.config/hypr/hyprtoolkit.conf"
"wayland/satty/config.toml" = "~/.config/satty/config.toml"
"wayland/satty/overrides.css" = "~/.config/satty/overrides.css"
"wayland/waybar/base.jsonc" = "~/.config/waybar/base.jsonc"
"wayland/waybar/hyprland.jsonc" = "~/.config/waybar/hyprland.jsonc"
"wayland/waybar/niri.jsonc" = "~/.config/waybar/niri.jsonc"
"wayland/waybar/style.css" = "~/.config/waybar/style.css"
"wayland/waybar/vpn.sh" = "~/.config/waybar/vpn.sh"
"wayland/fuzzel/fuzzel.ini" = "~/.config/fuzzel/fuzzel.ini"
"wayland/fuzzel/notifications.ini" = "~/.config/fuzzel/notifications.ini"
"wayland/fuzzel/dot-missed.svg" = "~/.config/fuzzel/dot-missed.svg"
"wayland/fuzzel/dot-read.svg" = "~/.config/fuzzel/dot-read.svg"
"wayland/mako/config" = "~/.config/mako/config"
"wayland/fcitx5/org.fcitx.Fcitx5.desktop" = "~/.config/autostart/org.fcitx.Fcitx5.desktop"
"wayland/fcitx5/themes/nord/theme.conf" = "~/.local/share/fcitx5/themes/nord/theme.conf"
"wayland/dbus/org.gnome.Settings.service" = "~/.local/share/dbus-1/services/org.gnome.Settings.service"
"wayland/gtk-4.0/gtk.css" = "~/.config/gtk-4.0/gtk.css"

[hyprland]
# Hyprland next to GNOME and niri, the default session; hyprland/install.sh
# installs the packages (needs sudo)
depends = ["wayland"]

[hyprland.files]
"hyprland/hyprland.lua" = "~/.config/hypr/hyprland.lua"
"hyprland/reload.sh" = "~/.config/hypr/reload.sh"
"hyprland/move.sh" = "~/.config/hypr/move.sh"
"hyprland/hyprsunset.conf" = "~/.config/hypr/hyprsunset.conf"
"hyprland/xdg-desktop-portal/hyprland-portals.conf" = "~/.config/xdg-desktop-portal/hyprland-portals.conf"
"hyprland/xdg-desktop-portal-wlr/config" = "~/.config/xdg-desktop-portal-wlr/config"

[niri]
# niri next to GNOME (and Hyprland, if enabled), as the default session;
# niri/install.sh builds it, makes GDM preselect it and installs the packages
# it adds on top of hyprland/install.sh's
depends = ["wayland"]

[niri.files]
"niri/config.kdl" = "~/.config/niri/config.kdl"
"niri/reload.sh" = "~/.config/niri/reload.sh"
"niri/move.sh" = "~/.config/niri/move.sh"
"niri/stack.sh" = "~/.config/niri/stack.sh"
"niri/resize.sh" = "~/.config/niri/resize.sh"
"niri/autostart/im-launch.desktop" = "~/.config/autostart/im-launch.desktop"
"niri/autostart/SACMonitor.desktop" = "~/.config/autostart/SACMonitor.desktop"
"niri/autostart/nm-applet.desktop" = "~/.config/autostart/nm-applet.desktop"
"niri/xdg-desktop-portal/niri-portals.conf" = "~/.config/xdg-desktop-portal/niri-portals.conf"

[claude.files]
# Not ~/.claude/settings.json: Claude Code rewrites it and it carries
# machine-specific state. Set these in it by hand:
#   "theme": "custom:dark-ansi-tmux" (dark-ansi with tmux's mode-style selection)
#   hooks.Stop, and hooks.Notification with matcher "permission_prompt", each a
#   command hook running ~/.claude/hooks/tmux-bell
"claude/themes/dark-ansi-tmux.json" = "~/.claude/themes/dark-ansi-tmux.json"
"claude/hooks/tmux-bell" = "~/.claude/hooks/tmux-bell"

[libreoffice.files]
# Needs libreoffice-gtk3; without it LibreOffice falls back to the X11 "gen"
# backend and ignores GTK themes. post_deploy.sh fetches the Nordic theme
# and installs libreoffice/nord as an extension (Nord application colors and
# dark icons), since registrymodifications.xcu is rewritten by LibreOffice.
"libreoffice/libreoffice" = "~/bin/libreoffice"
