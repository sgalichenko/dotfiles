#############################
########## Bindings
#############################

# Set the prefix to `ctrl + a` instead of `ctrl + b`
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Enable locking (requires vlock)
set -g lock-command vlock
set -g lock-after-time 0 # Seconds; 0 = never
bind L lock-session

# Use | and - to split a window vertically and horizontally instead of " and % respectively.
# New panes and windows start in the current pane's directory, not tmux's own.
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Open ~/.tmux.conf in vim and reload settings on quit
bind e new-window -n '~/.tmux.conf' "sh -c 'nvim ~/.tmux.conf && tmux source ~/.tmux.conf'"

# Use r to quickly reload tmux settings
bind r \
	source-file ~/.tmux.conf \;\
	display 'Reloaded tmux config'

bind Q confirm-before -p "kill window #W? (y/n)" kill-window

# K kills the numbered sessions nobody is attached to (the +N on the badge)
bind K kill-session -a -f '#{&&:#{m/r:^[0-9]+$,#{session_name}},#{!:#{session_attached}}}'

# Session list (prefix+s) in a floating pane rather than over the whole
# window. prefix+Tab and prefix+S-Tab are tmux 3.8's fast window and session
# switchers, left at their defaults
bind s new-pane -E -x 80% -y 70% \; move-pane -P centre \; choose-tree -hks

# Shift arrow to switch windows, or prefix C-p/C-n; prefix a for the last one
bind -n S-Left  previous-window
bind -n S-Right next-window
bind C-p previous-window
bind C-n next-window
bind a last-window

# Ctrl+arrows to switch panes, plus Alt+hjkl as a home-row alternative.
#
# These are prefix-less, so tmux consumes Ctrl+arrow before the program in
# the pane sees it. That is the intended trade: zsh here has no binding for
# the Ctrl+arrow sequences (^[[1;5C etc.) anyway, so nothing is lost. If you
# ever want word-wise movement on them instead, delete the four C- lines
# below and add to .zshrc:
#   bindkey "^[[1;5C" forward-word
#   bindkey "^[[1;5D" backward-word
#
# While nvim has the pane (smart-splits.nvim sets @pane-is-vim), the keys go
# to it: it moves between its own splits and hands over to tmux at its edge.
bind -n C-Left  if -F "#{@pane-is-vim}" "send-keys C-Left"  "select-pane -L"
bind -n C-Right if -F "#{@pane-is-vim}" "send-keys C-Right" "select-pane -R"
bind -n C-Up    if -F "#{@pane-is-vim}" "send-keys C-Up"    "select-pane -U"
bind -n C-Down  if -F "#{@pane-is-vim}" "send-keys C-Down"  "select-pane -D"
bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "select-pane -L"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "select-pane -R"
bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "select-pane -U"
bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "select-pane -D"

# Shift-movement keys will resize panes
bind -n -r C-S-Left resize-pane -L 15
bind -n -r C-S-Right resize-pane -R 15
bind -r C-S-Up resize-pane -U 15
bind -r C-S-Down resize-pane -D 15

bind C-s setw synchronize-panes

bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down

# Copy mode bindings (vi-style)
# Left click drag to highlight, releases copy to clipboard automatically
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/bin/clip"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/bin/clip"
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Select word under cursor in copy mode (C-i)
bind -T copy-mode-vi C-i send-keys b \; send -X begin-selection \; send-keys E

# s in copy mode (prefix, [, s): jump to text on screen, like Vimium's find.
# The cursor moves to the nearest match above as you type; Enter keeps it
# there (Escape gives up), then v to select, Enter to copy, and n/N for the
# next/previous match. Matches are coloured as fingers' (Ctrl+Shift+C), see
# copy-mode-match-style below.
bind -T copy-mode-vi s command-prompt -i -T search -p "jump:" { send-keys -X search-backward-incremental "%%%" }

# [ and ] jump between shell prompts, { to the start of a command's output.
# zsh marks them with OSC 133 (see .zshrc)
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt
bind -T copy-mode-vi '{' send-keys -X previous-prompt -o

# Alt+1..3 toggle popups, each backed by its own session (attached if it
# exists, created otherwise). A new one turns its own status bar off: a
# global after-new-session hook would be shared by all three, and fire for
# every other session too.
#
# Each records its host client, size and the host's size in @popup-<session>,
# so popup-resize can reopen it at the new size when the window is resized
# (tmux sizes a popup only as it opens).
set-hook -g client-resized 'run-shell -b "~/.tmux/popup-resize"'

# POPUP ALT-1
bind -n -N 'Toggle popup window' M-1 if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    set -gF @popup-popup "#{client_name} 80% 75% #{client_width}x#{client_height}"
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E \
    'tmux attach-session -t popup || \
    tmux new-session -s popup \; set status off'
}

# SCRATCHPAD ALT-2
bind -n -N 'Toggle scratchpad window' M-2 if-shell -F '#{==:#{session_name},scratchpad}' {
    detach-client
} {
    set -gF @popup-scratchpad "#{client_name} 80% 75% #{client_width}x#{client_height}"
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E \
    'tmux attach-session -t scratchpad || \
    tmux new-session -s scratchpad nvim -n -c "autocmd TextChanged,TextChangedI,FocusLost <buffer> silent! update" "$HOME/notes/scratchpad" \; set status off'
}

# LAZYGIT ALT-3
bind -n -N 'Toggle Lazygit' M-3 if-shell -F '#{==:#{session_name},lazygit}' {
    detach-client
} {
    set -gF @popup-lazygit "#{client_name} 90% 90% #{client_width}x#{client_height}"
    display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E \
    'tmux attach-session -t lazygit || \
    tmux new-session -s lazygit bash -c lazygit \; set status off'
}

#############################
########## Settings
#############################

# On, so OSC 52 copies from inside panes (nvim over ssh) reach the local
# clipboard via the terminal. The ~/bin/clip bindings above still handle
# tmux's own copy-mode.
set -g set-clipboard on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
# terminal-features is evaluated per-client, unlike terminal-overrides with an
# interpolated ${TERM}, which only matched whatever TERM was set at load time
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -g default-shell /usr/bin/zsh
setw -g mode-keys vi

# Reduce escape-time for faster key response (important for Neovim)
set -sg escape-time 10

# Messages stay up 4s, not 0.75s
set -g display-time 4000

# emacs keys at the command prompt (prefix :), not vi, which tmux would pick
# from EDITOR=nvim
set -g status-keys emacs

# Size a window to the smallest client actually viewing it, not to every
# client of the session
setw -g aggressive-resize on

# A command that took 10s or more and finished in a background window rings
# its bell, turning the tab red as tmux-bell does for Claude. zsh reports
# commands with OSC 133 (see .zshrc)
set-hook -g pane-command-finished {
    if -F '#{&&:#{!:#{window_active}},#{e|>=:#{hook_command_duration},10}}' {
        run -b 'printf "\a" > #{pane_tty}'
    }
}

# Pass focus events through to applications (enables autoread in Neovim etc.)
set -g focus-events on

# Refresh status line every 5 seconds
set -g status-interval 5

# Start window indices at 1 (more ergonomic), renumber on close
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Large scrollback buffer
setw -g history-limit 100000

# Copy mode numbers lines like nvim's relativenumber (so 12k works); their
# colours, and the cursor line's, are with the others below
setw -g copy-mode-line-numbers hybrid

# Scrollbars only while scrolling or hovering
setw -g pane-scrollbars auto-hide

# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 150

# %hidden: usable in this file, but kept out of the global environment, which
# every pane and popup inherits (a plain name=value line lands there)
%hidden nord_dark0="#2e3440"
%hidden nord_dark1="#3b4252"
%hidden nord_dark2="#434c5e"
%hidden nord_dark3="#4c566a"
%hidden nord_white0="#d8dee9"
%hidden nord_white1="#e5e9f0"
%hidden nord_white2="#eceff4"
%hidden nord_cyan="#8fbcbb"
%hidden nord_blue0="#88c0d0"
%hidden nord_blue1="#81a1c1"
%hidden nord_blue2="#5e81ac"
%hidden nord_red="#bf616a"
%hidden nord_orange="#d08770"
%hidden nord_yellow="#ebcb8b"
%hidden nord_green="#a3be8c"
# 10% nord_dark0 mixed into nord_green for the named-session badge
%hidden nord_green_dim="#97b084"
%hidden nord_purple="#b48ead"

# Nord in tmux 3.8's theme colours, which its own screens use (the prefix+Tab
# switchers, customize mode, display-panes, copy-mode line numbers,
# scrollbars). dark: Nord is dark, whatever the terminal reports
set -g theme dark
set -g dark-theme-black $nord_dark0
set -g dark-theme-dark-grey $nord_dark1
set -g dark-theme-light-grey $nord_dark3
set -g dark-theme-white $nord_white0
set -g dark-theme-red $nord_red
set -g dark-theme-green $nord_green
set -g dark-theme-yellow $nord_yellow
set -g dark-theme-blue $nord_blue0
set -g dark-theme-cyan $nord_cyan
set -g dark-theme-magenta $nord_purple

# Default statusbar color
set-option -g status-style bg=$nord_dark1,fg=$nord_white1

# Active pane border color (yellow when synchronized, default otherwise)
set -g pane-active-border-style "#{?pane_in_mode,fg=$nord_white0,#{?synchronize-panes,fg=$nord_yellow,fg=$nord_white0}}"

# Inactive pane border color
set -g pane-border-style "#{?pane_in_mode,fg=$nord_white0,#{?synchronize-panes,fg=$nord_yellow,fg=$nord_dark3}}"

# Copy-mode search matches as fingers draws its (Ctrl+Shift+C): every match
# in yellow, the one the cursor is on in fingers' hint red
set -g copy-mode-match-style "fg=$nord_dark0,bg=$nord_yellow"
set -g copy-mode-current-match-style "fg=$nord_white2,bg=$nord_red,bold"
# Line numbers without the default dim, which loses nord_dark3 on nord_dark0;
# the cursor's line shaded like the status bar
setw -g copy-mode-line-number-style "fg=$nord_dark3"
setw -g copy-mode-current-line-style "bg=$nord_dark1"

# Message info
set-option -g message-style bg=$nord_dark1,fg=$nord_white0

# Writing commands inactive
set-option -g message-command-style bg=$nord_dark1,fg=$nord_white0

# Pane number display
set-option -g display-panes-active-colour $nord_red
set-option -g display-panes-colour $nord_dark0

# Clock
set-window-option -g clock-mode-colour $nord_white1

# Selection
# ~35% nord_blue2 mixed into nord_dark0 so selections are less glaring
set-window-option -g mode-style bg="#3f4f66"

# Popups and menus on the terminal's own background, as before tmux 3.8, which
# paints them grey by default
set-option -g popup-style default
set-option -g popup-border-style default
set-option -g menu-style default
set-option -g menu-border-style default
# Likewise the session list's (prefix+s) preview: its borders, and the blank
# space around a previewed pane, which 3.8 fills grey
set-option -g tree-mode-border-style default
set-option -g fill-character ''

# Session badge: blue for Super+Return's numbered sessions, green for named
# ones, red while the prefix is held.
# +N counts detached numbered sessions, the ones that pile up unseen.
# `main` (the first terminal's session) shows as a rocket glyph instead
%hidden stale_sessions="#{S:#{?session_attached,,#{?#{m/r:^[0-9]+$,#{session_name}},x,}}}"
set-option -g status-left "\
#[fg=$nord_white0, bg=$nord_blue2]#{?#{m/r:^[0-9]+$,#S},,#[fg=$nord_dark0]#[bg=$nord_green_dim]}#{?client_prefix,#[fg=$nord_white0]#[bg=$nord_red],} #{?#{==:#S,main},󱓞 ,󰍹  #S}#{?$stale_sessions, +#{n:$stale_sessions},} \
#[fg=$nord_blue2, bg=$nord_dark1]#{?#{m/r:^[0-9]+$,#S},,#[fg=$nord_green_dim]}#{?client_prefix,#[fg=$nord_red],} "
# Right: a COPY badge while the pane is in copy mode, the host the active
# pane is ssh'd into (@ssh_host, set by ~/.ssh/bin/ssh-styled), and this
# machine's hostname only when tmux itself runs over SSH
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @remote 1'
# Badge colour for hosts without a tint; ssh-styled overrides it per pane
set -g @ssh_badge_bg $nord_blue0
set-option -g status-right "\
#{?pane_in_mode,#[fg=$nord_dark0#,bg=$nord_yellow] COPY ,}\
#{?@ssh_host,#[fg=$nord_dark0#,bg=#{@ssh_badge_bg}]   #{@ssh_host} ,}\
#{?@remote,#[fg=$nord_dark0#,bg=$nord_orange]  #h ,}"

# Window tabs: grey, or red when a bell rang in a background window.
# The current tab is white, yellow while panes are synchronized, cyan for `tmp`
%hidden tab_bg="#{?window_bell_flag,$nord_red,$nord_dark3}"
%hidden tab_fg="#{?window_bell_flag,$nord_dark0,$nord_white0}"
%hidden current_tab_bg="#{?#{==:#{window_name},tmp},$nord_cyan,#{?pane_synchronized,$nord_yellow,$nord_white0}}"
%hidden tab_flags="#{?window_zoomed_flag,  ,}#{?pane_synchronized,  ,}#{?#{==:#{window_name},tmp},  ,}"

# The formats colour bell tabs themselves; tmux's default `reverse` for these
# would swap every fg/bg below, since #[fg=,bg=] leaves the attribute on.
# Likewise the `underscore` tmux 3.8 puts on the current tab by default
set-window-option -g window-status-bell-style default
set-window-option -g window-status-activity-style default
set-window-option -g window-status-current-style default

set-window-option -g window-status-format "\
#[fg=$nord_dark1, bg=$tab_bg, noitalics]\
#[fg=$tab_fg] #I ⏽$tab_flags #W \
#[fg=$tab_bg, bg=$nord_dark1]"

set-window-option -g window-status-current-format "\
#[fg=$nord_dark1, bg=$current_tab_bg]\
#[fg=$nord_dark0] #I ⏽$tab_flags #W \
#[fg=$current_tab_bg, bg=$nord_dark1]"

#############################
########## Plugins
#############################

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sgalichenko/tmux-gentrify'

# Open files, links, search google (Shift+s after selecting)
set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.google.com/search?q='

# Quick-select, as in wezterm: hint letters over matches in the pane.
# Lowercase hint copies, uppercase copies and pastes, Ctrl+hint opens.
# The binary is in the plugin's bin/ (fetched from its GitHub release).
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key F
# fingers only takes named or colourN colours, not hex; the terminal's Nord
# palette turns these into nord_red and nord_yellow
set -g @fingers-hint-style "fg=colour15,bg=red,bold"
set -g @fingers-highlight-style "fg=black,bg=yellow"
set -g @fingers-show-copied-notification 1

# The quick-select patterns from .wezterm.lua. They are joined into one
# alternation in the order the --patterns list below names them, and the
# first alternative that matches wins, so specific patterns go before
# general ones (a UUID before the hash pattern, which would split it).
# PCRE, single-quoted so backslashes are literal; \x22 and \x27 are " and '.
# No inline (?i): inside the alternation it would leak into every pattern
# after it, so the hex colour classes spell out both cases instead.
# A URL stops at │, the border quick-select-window draws between panes
set -g @fingers-pattern-qs_url   'https?://[^\s│]*[^\s.,;:!?)\]}>\x22\x27│]'
set -g @fingers-pattern-qs_email '[\w.+-]+@[\w.-]*[\w-]'
set -g @fingers-pattern-qs_color '#(?:[0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{4}|[0-9a-fA-F]{3})\b'
set -g @fingers-pattern-qs_uuid  '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'
set -g @fingers-pattern-qs_mac   '\b(?:[0-9a-f]{2}:){5}[0-9a-f]{2}\b'
set -g @fingers-pattern-qs_ip    '\b(?:(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(?:/\d{1,2})?(?::\d{1,5})?\b'
set -g @fingers-pattern-qs_host  '\b(?:s[pisd]|a[psdt]|e[mp]c?)-[\w-]*\d[\w-]*\b'
set -g @fingers-pattern-qs_fqdn  '\b(?:[\w-]+\.)+(?:com|org|net|edu|gov|io|dev|jp|local|internal|cloud|app)\b'
# Paths: relative ones (.ssh/config, src/main.rs, ./run.sh, ~/.zshrc) need one
# slash, absolute ones two (so a lone /usr doesn't light up). The lookbehind
# keeps them from starting mid-word or mid-URL (the //host/... of a link).
set -g @fingers-pattern-qs_path  '(?<![\w.~/@+-])(?:(?:~|[\w.@+-]+)(?:/[\w.@+-]+)+|(?:/[\w.@+-]+){2,})\b'
set -g @fingers-pattern-qs_hash  '\b[0-9a-f]{7,64}\b'

# Ctrl+Shift+C and Ctrl+Shift+O. A terminal sends plain ^C for Ctrl+Shift+C,
# so the terminal is set to send these private sequences instead and tmux
# names them User0/User1 (wezterm: SendString, ghostty: keybind csi:).
# quick-select-window runs fingers over every visible pane, not just this one.
set -s user-keys[0] "\e[9101~"
set -s user-keys[1] "\e[9102~"
bind -n User0 run -b "~/.tmux/quick-select-window #{pane_id} --patterns qs_url,qs_email,qs_color,qs_uuid,qs_mac,qs_ip,qs_host,qs_fqdn,qs_path,qs_hash"
bind -n User1 run -b "~/.tmux/quick-select-window #{pane_id} --patterns qs_url --main-action :open:"

# Ctrl+Shift+Y in ghostty: run yazi's `y` wrapper, but only at a zsh prompt.
# C-u first clears anything half-typed on the line.
set -s user-keys[2] "\e[9103~"
bind -n User2 if -F '#{==:#{pane_current_command},zsh}' 'send-keys C-u y Enter'

if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
