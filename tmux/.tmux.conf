#############################
########## Bindings
#############################

# Set the prefix to `ctrl + a` instead of `ctrl + b`
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Enable locking (requires vlock)
set -g lock-command vlock
set -g lock-after-time 0 # Seconds; 0 = never
bind L lock-session

# Use | and - to split a window vertically and horizontally instead of " and % respectively.
# New panes and windows start in the current pane's directory, not tmux's own.
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Open ~/.tmux.conf in vim and reload settings on quit
unbind e
bind e new-window -n '~/.tmux.conf' "sh -c 'nvim ~/.tmux.conf && tmux source ~/.tmux.conf'"

# Use r to quickly reload tmux settings
unbind r
bind r \
	source-file ~/.tmux.conf \;\
	display 'Reloaded tmux config'

bind Q confirm-before -p "kill window #W? (y/n)" kill-window

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Ctrl+arrows to switch panes, plus Alt+hjkl as a home-row alternative.
#
# These are prefix-less, so tmux consumes Ctrl+arrow before the program in
# the pane sees it. That is the intended trade: zsh here has no binding for
# the Ctrl+arrow sequences (^[[1;5C etc.) anyway, so nothing is lost. If you
# ever want word-wise movement on them instead, delete the four C- lines
# below and add to .zshrc:
#   bindkey "^[[1;5C" forward-word
#   bindkey "^[[1;5D" backward-word
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Shift-movement keys will resize panes
bind -n -r C-S-Left resize-pane -L 15
bind -n -r C-S-Right resize-pane -R 15
bind -r C-S-Up resize-pane -U 15
bind -r C-S-Down resize-pane -D 15

# Drop resurrect's former C-s/C-r bindings: a reload doesn't remove bindings
# that are no longer produced, so they'd linger in a running server.
unbind C-r
bind C-s setw synchronize-panes

bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down

# Copy mode bindings (vi-style)
# Left click drag to highlight, releases copy to clipboard automatically
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
unbind p
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Select word under cursor in copy mode (C-i)
bind -T copy-mode-vi C-i send-keys b \; send -X begin-selection \; send-keys E

# Alt+1..4 toggle popups, each backed by its own session (attached if it
# exists, created otherwise). A new one turns its own status bar off: a
# global after-new-session hook would be shared by all four, and fire for
# every other session too.

# POPUP ALT-1
bind -n -N 'Toggle popup window' M-1 if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E \
    'tmux attach-session -t popup || \
    tmux new-session -s popup \; set status off'
}

# SCRATCHPAD ALT-2
bind -n -N 'Toggle scratchpad window' M-2 if-shell -F '#{==:#{session_name},scratchpad}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E \
    'tmux attach-session -t scratchpad || \
    tmux new-session -s scratchpad nvim "$HOME/notes/scratchpad" \; set status off'
}

# LAZYGIT ALT-3
bind -n -N 'Toggle Lazygit' M-3 if-shell -F '#{==:#{session_name},lazygit}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E \
    'tmux attach-session -t lazygit || \
    tmux new-session -s lazygit bash -c lazygit \; set status off'
}

# VIFM ALT-4
bind -n -N 'Toggle VIFM' M-4 if-shell -F '#{==:#{session_name},vifm}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 70% -h 70% -E \
    'tmux attach-session -t vifm || \
    tmux new-session -s vifm bash -c vifm \; set status off'
}

#############################
########## Settings
#############################

set -g mouse on
# On, so OSC 52 copies from inside panes (nvim over ssh) reach the local
# clipboard via wezterm. The explicit xclip bindings above still handle
# tmux's own copy-mode.
set -g set-clipboard on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
# terminal-features is evaluated per-client, unlike terminal-overrides with an
# interpolated ${TERM}, which only matched whatever TERM was set at load time
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -g default-shell /usr/bin/zsh
setw -g mode-keys vi

# Reduce escape-time for faster key response (important for Neovim)
set -sg escape-time 10

# Pass focus events through to applications (enables autoread in Neovim etc.)
set -g focus-events on

# Refresh status line every 5 seconds
set -g status-interval 5

# Start window indices at 1 (more ergonomic), renumber on close
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Large scrollback buffer
setw -g history-limit 100000

# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 150

# %hidden: usable in this file, but kept out of the global environment, which
# every pane and popup inherits (a plain name=value line lands there)
%hidden bg="#2f343f"
%hidden nord_dark0="#2e3440"
%hidden nord_dark1="#3b4252"
%hidden nord_dark2="#434c5e"
%hidden nord_dark3="#4c566a"
%hidden nord_white0="#d8dee9"
%hidden nord_white1="#e5e9f0"
%hidden nord_white2="#eceff4"
%hidden nord_cyan="#8fbcbb"
%hidden nord_blue0="#88c0d0"
%hidden nord_blue1="#81a1c1"
%hidden nord_blue2="#5e81ac"
%hidden nord_red="#bf616a"
%hidden nord_orange="#d08770"
%hidden nord_yellow="#ebcb8b"
%hidden nord_green="#a3be8c"
%hidden nord_purple="#b48ead"

# Default statusbar color
set-option -g status-style bg=$nord_dark1,fg=$nord_white1

# Default window title colors
set-window-option -g window-status-style bg=$nord_yellow,fg=$bg

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=$bg,fg=$nord_dark3

# Active window title colors
set-window-option -g window-status-current-style bg=$nord_red,fg=$bg

# Active pane border color (yellow when synchronized, default otherwise)
set -g pane-active-border-style "#{?pane_in_mode,fg=$nord_white0,#{?synchronize-panes,fg=$nord_yellow,fg=$nord_white0}}"

# Inactive pane border color
set -g pane-border-style "#{?pane_in_mode,fg=$nord_white0,#{?synchronize-panes,fg=$nord_yellow,fg=$nord_dark3}}"

# Message info
set-option -g message-style bg=$nord_dark1,fg=$nord_white0

# Writing commands inactive
set-option -g message-command-style bg=$nord_dark1,fg=$nord_white0

# Pane number display
set-option -g display-panes-active-colour $nord_red
set-option -g display-panes-colour $bg

# Clock
set-window-option -g clock-mode-colour $nord_white1

# Selection
set-window-option -g mode-style bg=$nord_blue2

# Bell
set-window-option -g window-status-bell-style bg=$nord_red,fg=$nord_dark0

set-option -g status-left "\
#[fg=$nord_white0, bg=$nord_blue2, bold]#{?client_prefix,#[bg=$nord_red],} 󰍹  #S \
#[fg=$nord_blue2, bg=$nord_dark1, bold]#{?client_prefix,#[fg=$nord_red],} "
set-option -g status-right "#[fg=$nord_white0, bg=$nord_dark3, bold] #(hostname) "

set-window-option -g window-status-format "\
#[fg=$nord_dark1, bg=$nord_dark3, noitalics]\
#[fg=$nord_white0, bg=$nord_dark3] #I ⏽#{?window_zoomed_flag,  ,}#{?pane_synchronized,  ,}#{?#{==:#{window_name},tmp},  ,}\
#[fg=$nord_white0, bg=$nord_dark3] #W \
#[fg=$nord_dark3, bg=$nord_dark1]"

set-window-option -g window-status-current-format "\
#[fg=$nord_dark1, bg=$nord_white0]#{?pane_synchronized,#[bg=$nord_yellow],}#{?window_zoomed_flag,#[bg=$nord_white0]#[fg=$nord_dark1],}#{?#{==:#{window_name},tmp},#[bg=$nord_cyan],}\
#[fg=$nord_dark0, bg=$nord_white0, bold]#{?pane_synchronized,#[bg=$nord_yellow]#[fg=$nord_dark0],}#{?window_zoomed_flag,#[bg=$nord_white0]#[fg=$nord_dark0],}#{?#{==:#{window_name},tmp},#[bg=$nord_cyan]#[fg=$nord_dark0],} #I ⏽#{?window_zoomed_flag,  ,}#{?pane_synchronized,  ,}#{?#{==:#{window_name},tmp},  ,}\
#[fg=$nord_dark0, bg=$nord_white0, bold]#{?pane_synchronized,#[bg=$nord_yellow]#[fg=$nord_dark0],}#{?window_zoomed_flag,#[bg=$nord_white0]#[fg=$nord_dark0],}#{?#{==:#{window_name},tmp},#[bg=$nord_cyan]#[fg=$nord_dark0],} #W \
#[fg=$nord_white0, bg=$nord_dark1]#{?pane_synchronized,#[fg=$nord_yellow],}#{?window_zoomed_flag,#[bg=$nord_dark1]#[fg=$nord_white0],}#{?#{==:#{window_name},tmp},#[fg=$nord_cyan],}"

#############################
########## Plugins
#############################

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sgalichenko/tmux-gentrify'

# Open files, links, search google (Shift+s after selecting)
set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.google.com/search?q='

# Survive reboots: save/restore sessions, panes and their working dirs
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# resurrect defaults to prefix+C-s / prefix+C-r, which would take over the
# synchronize-panes binding above (tpm loads last, so the plugin wins).
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
