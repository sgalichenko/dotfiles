# Under niri: GNOME's portal does screen sharing, since niri answers it in
# mutter's place, and it can share single windows, not just whole monitors as
# wlroots' portal does under Hyprland (see hyprland-portals.conf). It also
# does screenshots. The GTK portal does file pickers and the rest, as there.
# If sharing misbehaves, wlr also works on niri: set ScreenCast=wlr.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.Secret=gnome-keyring
