# Plain Nord lock screen: clock and a password field on the desktop colour.
general {
    hide_cursor = true
}

background {
    color = rgb(2f343f)
}

label {
    text = $TIME
    color = rgb(eceff4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    size = 280, 44
    outline_thickness = 2
    rounding = 0
    outer_color = rgb(4c566a)
    inner_color = rgb(3b4252)
    font_color = rgb(eceff4)
    check_color = rgb(88c0d0)
    fail_color = rgb(bf616a)
    placeholder_text =
    fail_text = $FAIL
    dots_center = true
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
