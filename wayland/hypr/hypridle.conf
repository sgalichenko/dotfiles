# Lock after an hour idle, screens off a minute later. Shared by Hyprland and
# niri: wm turns the screens off through whichever is running.
general {
    # Log to a file so a misbehaving lock screen leaves evidence
    lock_cmd = pidof hyprlock || hyprlock >"$XDG_RUNTIME_DIR/hyprlock.log" 2>&1
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/wayland/wm dpms on
}

listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 3660
    on-timeout = ~/.config/wayland/wm dpms off
    on-resume = ~/.config/wayland/wm dpms on
}
