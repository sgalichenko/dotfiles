# App launcher for Hyprland and niri, styled after rofi/config.rasi. Colours are
# RRGGBBAA. Sizes were worked out from RobotoMono 12pt at 96 dpi, as rofi
# draws it under Xwayland (a 21px line); the font is now JetBrainsMono,
# whose 12pt advance is the same 9.6px.
#
# What fuzzel can't copy: rofi's 45% window size (fuzzel sizes in characters,
# set here for the laptop's 1920px panel), its empty space under the list,
# and the bold+underline on matched text. Combi mode's window list comes from
# wayland/scripts/launcher.sh, which feeds windows and apps to fuzzel --dmenu.
[main]
font = JetBrainsMono Nerd Font:size=12
# Size fonts by points at 96 dpi, as rofi does, not by each monitor's DPI
dpi-aware = no
terminal = ghostty -e
prompt = ""
placeholder = ""
icons-enabled = no
# fzf-style: letters in order, so "ff" finds Firefox and "gt" Ghostty
match-mode = fzf
# 45% of 1920px, less the border and padding, in 9.6px characters
width = 86
lines = 10
# rofi's element padding of 10 above and below a 21px line: 41px at 96 dpi.
# Given in points, since a px value isn't scaled, which crams the list and
# crops the bottom border on the Dell at scale 1.5
line-height = 30.75
# Roomier than rofi's 5+5: space around the edges and below the input line
horizontal-pad = 20
vertical-pad = 15
inner-pad = 10

[colors]
background = 2e3440ff
text = eceff4ff
prompt = eceff4ff
input = eceff4ff
placeholder = eceff4ff
# rofi marks matches with bold+underline in the same colour, so no colour here
match = eceff4ff
selection = 3b4252ff
selection-text = 88c0d0ff
selection-match = 88c0d0ff
border = eceff4ff

[border]
width = 1
radius = 0
