# Nord candidate popup for fcitx5's classic UI, styled after wayland/fuzzel/fuzzel.ini:
# nord0 panel, the selected candidate on nord1 in frost, a frost border.
# No page arrow or checkbox images; Page Up/Down and Tab still page.
[Metadata]
Name=Nord
Version=1
Author=Semyon Galichenko
Description=Nord
ScaleWithDPI=True

[InputPanel]
